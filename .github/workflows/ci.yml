name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Hangfire.Console.sln

      - name: Build
        run: dotnet build Hangfire.Console.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Hangfire.Console.Tests/Hangfire.Console.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/Hangfire.Console/Hangfire.Console.csproj -c Release --no-build -o artifacts