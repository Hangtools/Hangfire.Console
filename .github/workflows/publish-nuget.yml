name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      packageVersion:
        description: Package version override (for example, 1.4.4)
        required: false
        type: string
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Hangfire.Console.sln

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.packageVersion }}"

          if ([string]::IsNullOrWhiteSpace($version) -and "${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          }

          if ($version.StartsWith("v", [System.StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Package version could not be determined. Provide workflow_dispatch input 'packageVersion' or publish from a v* tag."
          }

          "package_version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        run: dotnet build Hangfire.Console.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.version.outputs.package_version }}

      - name: Test
        run: dotnet test tests/Hangfire.Console.Tests/Hangfire.Console.Tests.csproj -c Release --no-build --no-restore

      - name: Pack
        run: dotnet pack src/Hangfire.Console/Hangfire.Console.csproj -c Release --no-build --no-restore -o artifacts /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.version.outputs.package_version }}

      - name: NuGet Sign-in (OIDC to Temp API Key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: hangtools

      - name: Publish package
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Filter *.nupkg |
            Where-Object { $_.Extension -ne '.snupkg' } |
            ForEach-Object {
              dotnet nuget push $_.FullName `
                --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" `
                --source "https://api.nuget.org/v3/index.json" `
                --skip-duplicate
            }

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg